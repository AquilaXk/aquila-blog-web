  "changeSummary": [
    "Remove retired member, preview, notification, legacy editor-draft, and optional-tracking storage from the current inventory."
  ],
  "sections": [
    {
      "id": "cookies-purpose",
      "title": "쿠키 정책의 목적",
      "body": [
        "이 문서는 AquilaLog가 현재 사용하는 cookie, localStorage와 sessionStorage 항목을 설명합니다."
      ]
    },
    {
      "id": "cookies-essential",
      "title": "필수 쿠키",
      "body": [
        "apiKey, accessToken, refreshToken, sessionKey는 관리자 인증 세션에 사용됩니다.",
        "apiKey, refreshToken과 sessionKey는 session 또는 로그인 유지 선택 시 최대 30일이고 accessToken은 session 또는 access-token TTL까지 유지됩니다.",
        "로그아웃, token 회전·세션 폐기 또는 브라우저 cookie 삭제로 제거됩니다. 공개 방문자는 이 cookie 없이 글을 읽을 수 있습니다."
      ]
    },
    {
      "id": "cookies-preference",
      "title": "설정과 관리자 저장소",
      "body": [
        "admin_profile_snapshot_v1 cookie는 공개 관리자 프로필의 단기 snapshot을 저장합니다.",
        "localStorage에는 auth.admin.savedEmail.v1, admin.editor.localDraft.create.v3, admin.editor.localDraft.post., admin.editor.customTags, admin.editor.customCategories, admin.contentStudio.listConditions.v1, aquila-cloud-video-upload-session을 사용할 수 있습니다.",
        "sessionStorage에는 admin.tools.taskDlqReplay.v1, admin.tools.searchRuntimeControl.v1, auth:me:anon-probe-suppress-until:v1, admin.tools.resultsFilter.v1, posts:runtime-endpoints:v1, __aquila_client_runtime_recovery__, feed:explorer:state:v2를 사용할 수 있습니다."
      ]
    },
    {
      "id": "cookies-inventory",
      "title": "현재 저장소 범위",
      "body": [
        "auth.admin.savedEmail.v1은 저장을 선택한 관리자 이메일만 보관하고 선택 해제, 교체 또는 브라우저 저장소 삭제로 제거합니다.",
        "v3 create/post 초안은 savedAt부터 7일 동안 유지되며 post 초안은 최근 20개 slot으로 제한됩니다.",
        "cloud video 항목은 업로드 완료·취소·stale 정리까지, sessionStorage 항목은 탭 세션 또는 각 기능의 짧은 TTL 동안 유지됩니다."
      ]
    },
    {
      "id": "cookies-control",
      "title": "관리 방법",
      "body": [
        "브라우저 설정에서 cookie와 브라우저 저장소를 확인하거나 삭제할 수 있습니다.",
        "관리자 편집 초안은 편집 화면의 삭제 동작, 발행·수정 완료, 만료 또는 브라우저 저장소 삭제로 제거됩니다."
      ]
    },
    {
      "id": "cookies-retention",
      "title": "보유기간",
      "body": [
        "인증 cookie와 각 브라우저 저장 항목은 위에 적은 현재 runtime 보유기간과 삭제 동작을 따릅니다.",
        "외부 서비스의 보유기간은 저장소에서 확인되지 않은 내용을 추정해 기재하지 않습니다."
      ]
    },
    {
      "id": "cookies-history",
      "title": "시행일·변경 이력",
      "body": [
        "현재 시행 버전은 1.0.4이며 시행 시각은 2026-09-01T12:43:19Z입니다.",
        "이전 버전 1.0.3, 1.0.2, 1.0.1, 1.0.0은 변경하지 않고 보존합니다. 변경 시 새 버전 문서를 추가합니다."
      ]
    }
  ]
