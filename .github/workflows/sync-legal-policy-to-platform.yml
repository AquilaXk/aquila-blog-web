name: Sync Web legal policy to Platform

on:
  push:
    branches:
      - main
    paths:
      - "legal/policies/**"
      - "legal/schemas/**"
      - "scripts/legal/**"
      - "contracts/export/legal-policy-manifest.json"
      - "src/apis/backend/legal.ts"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Web commit, branch, or pull request SHA to import
        required: true
        default: main
        type: string
      mode:
        description: Validate only or publish the Platform draft pull request
        required: true
        default: test-only
        type: choice
        options:
          - test-only
          - sync

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-legal-policy-sync
  cancel-in-progress: false

env:
  WEB_REPOSITORY: AquilaXk/aquila-blog-web
  PLATFORM_REPOSITORY: AquilaXk/aquila-blog
  SYNC_BRANCH: chore/web-policy-sync

jobs:
  sync:
    name: Web legal policy sync
    if: ${{ github.event_name == 'workflow_dispatch' || vars.REPO_SPLIT_SYNC_ENABLED == 'true' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve sync context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
          REQUESTED_MODE: ${{ inputs.mode }}
          SYNC_ENABLED: ${{ vars.REPO_SPLIT_SYNC_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            source_ref="${REQUESTED_SOURCE_REF}"
            mode="${REQUESTED_MODE}"
          else
            source_ref="${EVENT_SHA}"
            mode="sync"
          fi
          if [[ -z "${source_ref}" || "${source_ref}" == *$'\n'* || "${source_ref}" == *$'\r'* ]]; then
            echo "source_ref must be one non-empty line" >&2
            exit 1
          fi
          if [[ "${mode}" != "test-only" && "${mode}" != "sync" ]]; then
            echo "unsupported sync mode: ${mode}" >&2
            exit 1
          fi
          write_enabled=false
          if [[ "${mode}" == "sync" ]]; then
            if [[ "${SYNC_ENABLED}" != "true" ]]; then
              echo "sync mode requires REPO_SPLIT_SYNC_ENABLED=true" >&2
              exit 1
            fi
            write_enabled=true
          fi
          {
            printf 'source_ref=%s\n' "${source_ref}"
            printf 'mode=%s\n' "${mode}"
            printf 'write_enabled=%s\n' "${write_enabled}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout immutable Web source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.context.outputs.source_ref }}
          path: web
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve immutable Web commit
        id: source
        env:
          SOURCE_REF: ${{ steps.context.outputs.source_ref }}
          WRITE_ENABLED: ${{ steps.context.outputs.write_enabled }}
        run: |
          set -euo pipefail
          source_sha="$(git -C web rev-parse HEAD)"
          if [[ ! "${source_sha}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "resolved Web source is not a full commit SHA" >&2
            exit 1
          fi
          trusted=false
          if [[ "${WRITE_ENABLED}" == "true" ]]; then
            if [[ "$(git -C web rev-parse --is-shallow-repository)" == "true" ]]; then
              git -C web fetch --no-tags --unshallow origin
            fi
            git -C web fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            if ! git -C web merge-base --is-ancestor "${source_sha}" origin/main; then
              echo "sync source must be a commit reachable from Web origin/main" >&2
              exit 1
            fi
            trusted=true
          fi
          {
            printf 'source_sha=%s\n' "${source_sha}"
            printf 'source_ref=%s\n' "${SOURCE_REF}"
            printf 'trusted=%s\n' "${trusted}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout Platform main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AquilaXk/aquila-blog
          ref: main
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Export and verify canonical legal manifest
        working-directory: web
        run: |
          set -euo pipefail
          node scripts/legal/export-policy-manifest.mjs --check

      - name: Record canonical legal manifest SHA-256
        id: hashes
        working-directory: web
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto = require("node:crypto")
          const fs = require("node:fs")
          const manifestPath = "contracts/export/legal-policy-manifest.json"
          const manifestBytes = fs.readFileSync(manifestPath)
          const manifestSha256 = crypto.createHash("sha256").update(manifestBytes).digest("hex")
          if (!/^[a-f0-9]{64}$/.test(manifestSha256)) throw new Error("manifestSha256 is invalid")
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest_sha256=${manifestSha256}\n`)
          NODE
          sha256sum contracts/export/legal-policy-manifest.json

      - name: Verify current Platform legal lock
        id: current-lock
        working-directory: platform
        run: |
          set -euo pipefail
          node tools/contracts/check-web-policy-lock.mjs
          # shellcheck disable=SC2016 # Node property names must remain literal in this narrow extraction.
          manifest_sha256="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync("contracts/web/legal-policy-manifest.lock.json", "utf8")).manifestSha256)')"
          if [[ ! "${manifest_sha256}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "current manifestSha256 is invalid" >&2
            exit 1
          fi
          printf 'manifest_sha256=%s\n' "${manifest_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Prepare stable Platform sync branch
        if: ${{ steps.context.outputs.write_enabled == 'true' }}
        run: |
          set -euo pipefail
          set +e
          git -C platform ls-remote --exit-code --heads origin "refs/heads/${SYNC_BRANCH}" >/dev/null 2>&1
          sync_branch_status=$?
          set -e
          if [[ "${sync_branch_status}" -eq 0 ]]; then
            git -C platform fetch --no-tags origin "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}"
            git -C platform checkout -B "${SYNC_BRANCH}" "origin/${SYNC_BRANCH}"
            git -C platform \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              -c commit.gpgsign=false \
              merge --no-edit origin/main
          elif [[ "${sync_branch_status}" -eq 2 ]]; then
            git -C platform checkout -B "${SYNC_BRANCH}" origin/main
          else
            echo "unable to query stable Platform sync branch" >&2
            exit 1
          fi
          if ! git -C platform diff --quiet origin/main...HEAD -- . ':(exclude)contracts/web/legal-policy-manifest.lock.json'; then
            echo "stable sync branch contains tracked changes outside the legal policy lock" >&2
            exit 1
          fi

      - name: Capture stable Platform legal lock
        id: stable-lock
        working-directory: platform
        run: |
          set -euo pipefail
          node tools/contracts/check-web-policy-lock.mjs
          # shellcheck disable=SC2016 # Node property names must remain literal in this narrow extraction.
          manifest_sha256="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync("contracts/web/legal-policy-manifest.lock.json", "utf8")).manifestSha256)')"
          if [[ ! "${manifest_sha256}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "stable manifestSha256 is invalid" >&2
            exit 1
          fi
          printf 'manifest_sha256=%s\n' "${manifest_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Import Web policy manifest into Platform fixture
        working-directory: platform
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          node tools/contracts/import-web-policy-manifest.mjs \
            --source ../web/contracts/export/legal-policy-manifest.json \
            --source-repository "${WEB_REPOSITORY}" \
            --source-commit "${SOURCE_SHA}" \
            --output contracts/web/legal-policy-manifest.lock.json
          node tools/contracts/check-web-policy-lock.mjs

      - name: Detect canonical policy changes
        id: changes
        env:
          CURRENT_MANIFEST_SHA256: ${{ steps.current-lock.outputs.manifest_sha256 }}
          STABLE_MANIFEST_SHA256: ${{ steps.stable-lock.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # Node property names must remain literal in this narrow extraction.
          manifest_sha256="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync("platform/contracts/web/legal-policy-manifest.lock.json", "utf8")).manifestSha256)')"
          if [[ ! "${CURRENT_MANIFEST_SHA256}" =~ ^[a-f0-9]{64}$ || ! "${STABLE_MANIFEST_SHA256}" =~ ^[a-f0-9]{64}$ || ! "${manifest_sha256}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "manifestSha256 is invalid" >&2
            exit 1
          fi
          if [[ "${manifest_sha256}" != "${CURRENT_MANIFEST_SHA256}" ]]; then
            main_changed=true
          else
            main_changed=false
          fi
          if [[ "${manifest_sha256}" != "${STABLE_MANIFEST_SHA256}" ]]; then
            branch_changed=true
          else
            branch_changed=false
          fi
          if [[ "${main_changed}" == "true" || "${branch_changed}" == "true" ]]; then
            sync_required=true
          else
            sync_required=false
          fi
          {
            printf 'changed=%s\n' "${main_changed}"
            printf 'main_changed=%s\n' "${main_changed}"
            printf 'branch_changed=%s\n' "${branch_changed}"
            printf 'sync_required=%s\n' "${sync_required}"
          } >> "${GITHUB_OUTPUT}"

      - name: Assert read-only mode cannot publish
        if: ${{ steps.context.outputs.write_enabled != 'true' }}
        run: echo "::notice::test-only completed without creating a write token, pushing a branch, or opening a pull request"

      - name: Create repository sync token
        id: app-token
        if: ${{ steps.context.outputs.write_enabled == 'true' && steps.source.outputs.trusted == 'true' && steps.changes.outputs.sync_required == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: aquila-blog
          permission-contents: write
          permission-pull-requests: write

      - name: Preflight Platform draft PR
        id: preflight
        if: ${{ steps.context.outputs.write_enabled == 'true' && steps.source.outputs.trusted == 'true' && steps.changes.outputs.sync_required == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "${PLATFORM_REPOSITORY}" --state open --head "${SYNC_BRANCH}" --json number,isDraft,isCrossRepository,headRepository,baseRefName | jq '[.[] | select(.isCrossRepository == false and .headRepository.nameWithOwner == "AquilaXk/aquila-blog")]')"
          # shellcheck disable=SC2016 # jq filters must remain single-quoted.
          count="$(printf '%s' "${prs}" | jq 'length')"
          if [[ "${count}" -gt 1 ]]; then
            echo "expected exactly one draft PR or none for ${SYNC_BRANCH}" >&2
            exit 1
          fi
          pr_number=""
          if [[ "${count}" -eq 1 ]]; then
            # shellcheck disable=SC2016 # jq filters must remain single-quoted.
            is_draft="$(printf '%s' "${prs}" | jq -r '.[0].isDraft')"
            # shellcheck disable=SC2016 # jq filters must remain single-quoted.
            is_cross_repository="$(printf '%s' "${prs}" | jq -r '.[0].isCrossRepository')"
            # shellcheck disable=SC2016 # jq filters must remain single-quoted.
            head_repository="$(printf '%s' "${prs}" | jq -r '.[0].headRepository.nameWithOwner // empty')"
            # shellcheck disable=SC2016 # jq filters must remain single-quoted.
            base_ref_name="$(printf '%s' "${prs}" | jq -r '.[0].baseRefName // empty')"
            if [[ "${is_draft}" != "true" || "${is_cross_repository}" != "false" || "${head_repository}" != "AquilaXk/aquila-blog" || "${base_ref_name}" != "main" ]]; then
              echo "existing pull request is not exactly one draft PR from AquilaXk/aquila-blog" >&2
              exit 1
            fi
            # shellcheck disable=SC2016 # jq filters must remain single-quoted.
            pr_number="$(printf '%s' "${prs}" | jq -r '.[0].number')"
          fi
          {
            printf 'pr_number=%s\n' "${pr_number}"
            printf 'count=%s\n' "${count}"
          } >> "${GITHUB_OUTPUT}"

      - name: Commit latest Web policy snapshot
        id: commit
        if: ${{ steps.context.outputs.write_enabled == 'true' && steps.source.outputs.trusted == 'true' && steps.changes.outputs.sync_required == 'true' }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git -C platform config user.name "github-actions[bot]"
          git -C platform config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C platform config commit.gpgsign false
          git -C platform add contracts/web/legal-policy-manifest.lock.json
          if git -C platform diff --cached --quiet; then
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git -C platform commit -m "chore(legal): sync Web ${SOURCE_SHA:0:12}"
          echo "committed=true" >> "${GITHUB_OUTPUT}"

      - name: Push stable Platform sync branch
        if: ${{ steps.context.outputs.write_enabled == 'true' && steps.source.outputs.trusted == 'true' && steps.changes.outputs.sync_required == 'true' && steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git -C platform push origin "HEAD:refs/heads/${SYNC_BRANCH}"

      - name: Close stale Platform draft PR
        if: ${{ steps.context.outputs.write_enabled == 'true' && steps.source.outputs.trusted == 'true' && steps.changes.outputs.main_changed != 'true' && steps.changes.outputs.branch_changed == 'true' && steps.preflight.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PREFLIGHT_PR_NUMBER: ${{ steps.preflight.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr close "${PREFLIGHT_PR_NUMBER}" --repo "${PLATFORM_REPOSITORY}"

      - name: Create or update the single Platform draft PR
        if: ${{ steps.context.outputs.write_enabled == 'true' && steps.source.outputs.trusted == 'true' && steps.changes.outputs.main_changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          MANIFEST_SHA256: ${{ steps.hashes.outputs.manifest_sha256 }}
          PREFLIGHT_PR_NUMBER: ${{ steps.preflight.outputs.pr_number }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/web-policy-sync-pr.md"
          pr_title="[Chore] Web legal policy snapshot sync"
          # shellcheck disable=SC2016 # This bounded PR-body block intentionally keeps Markdown code ticks literal.
          {
            printf '## 🔗 Related Issue\n\n- #1453\n\n'
            printf '## 📝 Summary\n\n'
            printf '%s\n\n' 'Web canonical legal policy manifest를 Platform legal metadata lock으로 동기화하는 draft PR입니다. 이 PR은 production legal evidence가 확인되기 전까지 draft 상태를 유지합니다.'
            printf '## 🔄 Contract Sync\n\n'
            printf '%s\n' '- Plan ↔ Issue 문제/범위/완료조건/검증 동기화: Task 13B와 AquilaXk/aquila-blog-web#9의 Web→Platform legal snapshot contract를 적용합니다.'
            # shellcheck disable=SC2016 # Markdown code ticks are literal PR-body text; the SHA argument is expanded separately.
            printf -- '- Commit plan ↔ 실제 commit 매핑: `chore(legal): sync Web %s`.\n' "${SOURCE_SHA:0:12}"
            printf '%s\n\n' '- 미확정 구현 결정: 없음.'
            printf '## 🛠 Changes\n\n'
            # shellcheck disable=SC2016 # Markdown code ticks are literal PR-body text; values are expanded separately.
            printf -- '- source repository: `%s`\n' "${WEB_REPOSITORY}"
            printf -- '- source ref: `%s`\n' "${SOURCE_REF}"
            printf -- '- source commit: `%s`\n' "${SOURCE_SHA}"
            printf -- '- manifest SHA-256: `%s`\n\n' "${MANIFEST_SHA256}"
            printf '## 🎯 Scope\n\n'
            printf '%s\n' '- [ ] Frontend (해당 없음)'
            printf '%s\n' '- [ ] Backend (해당 없음)'
            printf '%s\n' '- [ ] Editor / Content Rendering (해당 없음)'
            printf '%s\n' '- [ ] Admin / Dashboard (해당 없음)'
            printf '%s\n' '- [ ] Performance / Bundle / Runtime (해당 없음)'
            printf '%s\n' '- [x] Infra / CI / Ops'
            printf '%s\n\n' '- [ ] Docs (해당 없음)'
            printf '## ✅ Validation\n\n'
            printf '%s\n' '- [x] 자동화 테스트를 수행했는가?'
            printf '%s\n' '- [ ] 필요한 수동 확인을 마쳤는가? Task 14 controlled sync가 소유한다.'
            printf '%s\n\n' '- [ ] 로그/메트릭/운영 지표를 확인했는가? production 변경이 없어 해당 없음.'
            printf '### 실행한 검증과 결과\n\n'
            # shellcheck disable=SC2016 # Markdown code ticks are literal PR-body text.
            printf '%s\n' '- `node scripts/legal/export-policy-manifest.mjs --check`: active policy content SHA-256와 canonical manifest bytes 검증 통과.'
            printf '%s\n\n' '- `node tools/contracts/import-web-policy-manifest.mjs ...` 및 `node tools/contracts/check-web-policy-lock.mjs`: Web source repository와 immutable SHA가 들어간 Platform lock 검증 통과.'
            printf '### 미실행 검증\n\n'
            printf '%s\n\n' '- 실제 Platform draft PR 생성·갱신과 promoted legal evidence 기록은 Task 14에서 `REPO_SPLIT_SYNC_ENABLED=true` controlled sync로 재실행한다.'
            printf '## 📸 Screenshot / API Example\n\n'
            printf '%s\n\n' '- N/A — CI legal metadata contract 변경으로 UI 또는 API 응답 변경이 없다.'
            printf '## ⚠️ Risk & Rollback\n\n'
            printf '%s\n' '- 예상 리스크: 잘못된 policy identity가 Platform lock에 반영될 수 있다.'
            printf '%s\n' '- 롤백 방법: draft PR을 merge하지 않고 닫거나 stable branch의 sync commit을 revert한다.'
            printf '%s\n\n' '- 승인 후 post-delivery 확인: Task 14에서 promoted legal page와 production verification run URL을 기록한 뒤에만 draft 해제를 검토한다.'
            printf '## Promoted legal evidence\n\n'
            printf '%s\n\n' 'Task 14 records the promoted `https://blog.aquilaxk.site` legal page and production verification run URL before this draft can be made ready.'
            printf '## ☑️ Checklist\n\n'
            printf '%s\n' '- [x] 관련 이슈를 정확히 연결했는가?'
            printf '%s\n' '- [x] base branch가 `main`인지 다시 확인했는가?'
            printf '%s\n' '- [x] PR 범위 밖 변경을 제외했는가?'
            printf '%s\n' '- [x] Plan, issue, commit, PR 설명이 서로 일치하는가?'
            printf '%s\n' '- [x] Worker가 추측해야 할 미확정 구현 결정이 남아 있지 않은가?'
            printf '%s\n' '- [x] 필요한 테스트와 검증 결과를 본문에 남겼는가?'
            printf '%s\n' '- [x] 미실행 검증이 있다면 사유와 재실행 조건을 남겼는가?'
            printf '%s\n' '- [x] SEO/권한/캐시/배포 영향이 있다면 본문에 설명했는가?'
            printf '%s\n' '- [x] API 계약 또는 운영 문서 변경이 있다면 함께 반영했는가?'
            printf '%s\n' '- [x] 새 코드 주석이 있다면 [코드 주석 정책](https://github.com/AquilaXk/aquila-blog/blob/main/docs/design/code-comment-policy.md)에 맞는 이유/불변조건/운영 영향을 설명하는가? 새 코드 주석 없음.'
          } > "${body_file}"
          if [[ -n "${PREFLIGHT_PR_NUMBER}" ]]; then
            gh pr edit "${PREFLIGHT_PR_NUMBER}" --repo "${PLATFORM_REPOSITORY}" --title "${pr_title}" --body-file "${body_file}"
          else
            gh pr create --repo "${PLATFORM_REPOSITORY}" --base main --head "${SYNC_BRANCH}" --draft --title "${pr_title}" --body-file "${body_file}"
          fi
