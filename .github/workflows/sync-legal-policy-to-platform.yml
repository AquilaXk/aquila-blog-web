name: Dispatch Web legal policy to Platform

"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Web commit, branch, or pull request ref to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: web-legal-policy-sync
  cancel-in-progress: false

env:
  WEB_REPOSITORY: AquilaXk/aquila-blog-web
  PLATFORM_REPOSITORY: AquilaXk/aquila-blog

jobs:
  dispatch:
    name: Validate and dispatch Web legal-policy identity
    if: ${{ github.event_name == 'workflow_dispatch' || vars.REPO_SPLIT_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve producer context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
          SYNC_ENABLED: ${{ vars.REPO_SPLIT_SYNC_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            source_ref="${REQUESTED_SOURCE_REF}"
            dispatch_enabled=false
          else
            source_ref="${EVENT_SHA}"
            if [[ "${SYNC_ENABLED}" != "true" ]]; then
              echo "automatic legal-policy delivery requires REPO_SPLIT_SYNC_ENABLED=true" >&2
              exit 1
            fi
            dispatch_enabled=true
          fi
          if [[ -z "${source_ref}" || "${source_ref}" == *$'\n'* || "${source_ref}" == *$'\r'* ]]; then
            echo "source_ref must be one non-empty line" >&2
            exit 1
          fi
          {
            printf 'source_ref=%s\n' "${source_ref}"
            printf 'dispatch_enabled=%s\n' "${dispatch_enabled}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout immutable Web source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.context.outputs.source_ref }}
          path: web
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact Web source identity
        id: source
        env:
          DISPATCH_ENABLED: ${{ steps.context.outputs.dispatch_enabled }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ steps.context.outputs.source_ref }}
        run: |
          set -euo pipefail
          source_commit="$(git -C web rev-parse HEAD)"
          if [[ ! "${source_commit}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "resolved Web source is not a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ "${DISPATCH_ENABLED}" == "true" && "${source_commit}" != "${EVENT_SHA}" ]]; then
            echo "automatic legal-policy delivery source does not match the push commit" >&2
            exit 1
          fi
          {
            printf 'source_commit=%s\n' "${source_commit}"
            printf 'source_ref=%s\n' "${SOURCE_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Export and verify canonical legal manifest
        working-directory: web
        run: |
          set -euo pipefail
          node scripts/legal/export-policy-manifest.mjs --check

      - name: Record canonical legal manifest SHA-256
        id: manifest
        working-directory: web
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto = require("node:crypto")
          const fs = require("node:fs")
          const manifestBytes = fs.readFileSync("contracts/export/legal-policy-manifest.json")
          const manifestSha256 = crypto.createHash("sha256").update(manifestBytes).digest("hex")
          if (!/^[a-f0-9]{64}$/.test(manifestSha256)) throw new Error("manifestSha256 is invalid")
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest_sha256=${manifestSha256}\n`)
          NODE

      - name: Complete manual validation without dispatch
        if: ${{ steps.context.outputs.dispatch_enabled != 'true' }}
        run: echo "::notice::manual legal-policy validation completed without a Platform token or repository dispatch"

      - name: Admit current Web main for delivery
        id: freshness
        if: ${{ steps.context.outputs.dispatch_enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_REPOSITORY: ${{ env.WEB_REPOSITORY }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${SOURCE_REPOSITORY}/commits/main" --jq '.sha')" || {
            echo "Web main lookup failed before legal-policy delivery" >&2
            exit 1
          }
          if [[ ! "${current_main}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Web main lookup returned an invalid commit" >&2
            exit 1
          fi
          if [[ "${SOURCE_COMMIT}" == "${current_main}" ]]; then
            should_dispatch=true
            reason=exact-current-web-main
          else
            should_dispatch=false
            reason=stale-web-source
          fi
          printf 'should_dispatch=%s\n' "${should_dispatch}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Web legal-policy freshness"
            echo "- result: ${should_dispatch}"
            echo "- reason: ${reason}"
            echo "- source: ${SOURCE_REPOSITORY}@${SOURCE_COMMIT}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create Platform dispatch token
        id: platform-token
        if: ${{ steps.freshness.outputs.should_dispatch == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: |
            aquila-blog
          permission-contents: write

      - name: Prepare exact legal-policy delivery
        id: delivery
        if: ${{ steps.freshness.outputs.should_dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ steps.platform-token.outputs.token }}
          SCHEMA_VERSION: "1"
          SOURCE_REPOSITORY: ${{ env.WEB_REPOSITORY }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          MANIFEST_SHA256: ${{ steps.manifest.outputs.manifest_sha256 }}
          TARGET_REPOSITORY: ${{ env.PLATFORM_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "${SCHEMA_VERSION}" == "1" ]] || exit 1
          [[ "${SOURCE_REPOSITORY}" == "AquilaXk/aquila-blog-web" ]] || exit 1
          [[ "${SOURCE_COMMIT}" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "${MANIFEST_SHA256}" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "${TARGET_REPOSITORY}" == "AquilaXk/aquila-blog" ]] || exit 1

          target_commit="$(gh api "repos/${TARGET_REPOSITORY}/commits/main" --jq '.sha')" || {
            echo "Platform main lookup failed before legal-policy delivery" >&2
            exit 1
          }
          if [[ ! "${target_commit}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Platform main lookup returned an invalid commit" >&2
            exit 1
          fi
          delivery_id="$(
            printf '%s\n' \
              "${SCHEMA_VERSION}" \
              "${SOURCE_REPOSITORY}" \
              "${SOURCE_COMMIT}" \
              "${MANIFEST_SHA256}" \
              "${TARGET_REPOSITORY}" \
              "${target_commit}" \
              | sha256sum | awk '{print $1}'
          )"
          if [[ ! "${delivery_id}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "legal-policy delivery ID calculation failed" >&2
            exit 1
          fi
          {
            printf 'target_commit=%s\n' "${target_commit}"
            printf 'delivery_id=%s\n' "${delivery_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch exact legal-policy identity to Platform
        if: ${{ steps.freshness.outputs.should_dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ steps.platform-token.outputs.token }}
          SCHEMA_VERSION: "1"
          SOURCE_REPOSITORY: ${{ env.WEB_REPOSITORY }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          MANIFEST_SHA256: ${{ steps.manifest.outputs.manifest_sha256 }}
          TARGET_REPOSITORY: ${{ env.PLATFORM_REPOSITORY }}
          TARGET_COMMIT: ${{ steps.delivery.outputs.target_commit }}
          DELIVERY_ID: ${{ steps.delivery.outputs.delivery_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${TARGET_REPOSITORY}/dispatches" \
            -f event_type="web_legal_policy_ready" \
            -f "client_payload[schema_version]=${SCHEMA_VERSION}" \
            -f "client_payload[source_repository]=${SOURCE_REPOSITORY}" \
            -f "client_payload[source_commit]=${SOURCE_COMMIT}" \
            -f "client_payload[manifest_sha256]=${MANIFEST_SHA256}" \
            -f "client_payload[target_repository]=${TARGET_REPOSITORY}" \
            -f "client_payload[target_commit]=${TARGET_COMMIT}" \
            -f "client_payload[delivery_id]=${DELIVERY_ID}"
          {
            echo "## Web legal-policy delivery"
            echo "- status: dispatched"
            echo "- source: ${SOURCE_REPOSITORY}@${SOURCE_COMMIT}"
            echo "- manifest SHA-256: ${MANIFEST_SHA256}"
            echo "- target: ${TARGET_REPOSITORY}@${TARGET_COMMIT}"
            echo "- delivery ID: ${DELIVERY_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
