name: Publish Web frontend image

on:
  push:
    branches: [main]

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: web-frontend-image-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    if: github.repository == 'AquilaXk/aquila-blog-web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Web main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate canonical Web source SHA
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Web source SHA must be a full lowercase commit SHA" >&2
            exit 1
          fi
          printf 'source_sha=%s\n' "${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate Platform handoff configuration
        env:
          REPO_SPLIT_SYNC_ENABLED: ${{ vars.REPO_SPLIT_SYNC_ENABLED }}
          REPO_SYNC_APP_CLIENT_ID: ${{ vars.REPO_SYNC_APP_CLIENT_ID }}
          REPO_SYNC_APP_PRIVATE_KEY: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "${REPO_SPLIT_SYNC_ENABLED}" == "true" ]]; then
            :
          else
            echo "Repository split sync must be explicitly enabled" >&2
            exit 1
          fi
          if ! [[ -n "${REPO_SYNC_APP_CLIENT_ID}" ]]; then
            echo "Repository sync GitHub App client ID must be configured" >&2
            exit 1
          fi
          if ! [[ -n "${REPO_SYNC_APP_PRIVATE_KEY}" ]]; then
            echo "Repository sync GitHub App private key must be configured" >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable Web image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: ghcr.io/aquilaxk/aquila-blog-web-front:sha-${{ github.sha }}
          build-args: NEXT_PUBLIC_AQUILA_BUILD_SHA=${{ steps.source.outputs.source_sha }}

      - name: Validate pushed image digest
        id: image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "pushed image digest must be immutable lowercase sha256" >&2
            exit 1
          fi
          image_ref="ghcr.io/aquilaxk/aquila-blog-web-front@${IMAGE_DIGEST}"
          printf 'image_ref=%s\nimage_digest=%s\n' "${image_ref}" "${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "${TRIVY_SHA256}" /tmp/trivy.tgz | sha256sum --check -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy

      - name: Pull and scan pushed immutable Web image
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REF}"
          trivy image \
            --ignorefile .trivyignore.yaml \
            --format cosign-vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --output /tmp/web-image-vulnerability.json \
            "${IMAGE_REF}"
          trivy image \
            --ignorefile .trivyignore.yaml \
            --format spdx-json \
            --output /tmp/web-image.spdx.json \
            "${IMAGE_REF}"

      - name: Attest Web image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: ghcr.io/aquilaxk/aquila-blog-web-front
          subject-digest: ${{ steps.image.outputs.image_digest }}
          push-to-registry: true

      - name: Attest Web image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: ghcr.io/aquilaxk/aquila-blog-web-front
          subject-digest: ${{ steps.image.outputs.image_digest }}
          push-to-registry: true
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: /tmp/web-image.spdx.json

      - name: Attest Web image vulnerability scan
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: ghcr.io/aquilaxk/aquila-blog-web-front
          subject-digest: ${{ steps.image.outputs.image_digest }}
          push-to-registry: true
          predicate-type: https://cosign.sigstore.dev/attestation/vuln/v1
          predicate-path: /tmp/web-image-vulnerability.json

      - name: Verify exact Web image attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: AquilaXk/aquila-blog-web
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${SOURCE_REPOSITORY}" \
            --source-digest "${SOURCE_SHA}" \
            --source-ref refs/heads/main \
            --signer-workflow AquilaXk/aquila-blog-web/.github/workflows/frontend-image.yml \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > /tmp/web-image-provenance.json
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${SOURCE_REPOSITORY}" \
            --source-digest "${SOURCE_SHA}" \
            --source-ref refs/heads/main \
            --signer-workflow AquilaXk/aquila-blog-web/.github/workflows/frontend-image.yml \
            --deny-self-hosted-runners \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json > /tmp/web-image-sbom.json
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${SOURCE_REPOSITORY}" \
            --source-digest "${SOURCE_SHA}" \
            --source-ref refs/heads/main \
            --signer-workflow AquilaXk/aquila-blog-web/.github/workflows/frontend-image.yml \
            --deny-self-hosted-runners \
            --predicate-type https://cosign.sigstore.dev/attestation/vuln/v1 \
            --format json > /tmp/web-image-vulnerability-attestation.json
          node scripts/security/native-image-evidence.mjs verify-attestation-set \
            /tmp/web-image-provenance.json \
            /tmp/web-image-sbom.json \
            /tmp/web-image-vulnerability-attestation.json \
            "https://github.com/${SOURCE_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/attempts/${PRODUCER_RUN_ATTEMPT}"

      - name: Check current Web source freshness
        id: freshness
        env:
          WEB_GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: AquilaXk/aquila-blog-web
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "${SOURCE_REPOSITORY}" != "AquilaXk/aquila-blog-web" ]; then
            echo "Web image delivery source repository is invalid" >&2
            exit 1
          fi
          if [[ ! "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Web image delivery source SHA must be full lowercase hex" >&2
            exit 1
          fi
          if [[ ! "${PRODUCER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Web image producer run identity is invalid" >&2
            exit 1
          fi
          if [ "${PRODUCER_RUN_URL}" != "https://github.com/${SOURCE_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}" ]; then
            echo "Web image producer run URL is invalid" >&2
            exit 1
          fi

          if ! CURRENT_WEB_MAIN_SHA="$(GH_TOKEN="${WEB_GH_TOKEN}" gh api "repos/${SOURCE_REPOSITORY}/commits/main" --jq '.sha')"; then
            echo "Web main SHA lookup failed before image dispatch" >&2
            exit 1
          fi
          if [[ ! "${CURRENT_WEB_MAIN_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Web main SHA lookup returned an invalid commit" >&2
            exit 1
          fi
          if [ "${SOURCE_SHA}" != "${CURRENT_WEB_MAIN_SHA}" ]; then
            printf 'should_dispatch=false\n' >> "${GITHUB_OUTPUT}"
            {
              echo "## Web image delivery"
              echo "- status: stale source; dispatch skipped"
              echo "- source: ${SOURCE_REPOSITORY}@${SOURCE_SHA}"
              echo "- current Web main SHA: ${CURRENT_WEB_MAIN_SHA}"
              echo "- producer run: [${PRODUCER_RUN_ID}](${PRODUCER_RUN_URL})"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          printf 'should_dispatch=true\n' >> "${GITHUB_OUTPUT}"

      - name: Create Platform dispatch token
        if: steps.freshness.outputs.should_dispatch == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: aquila-blog
          permission-contents: write

      - name: Prepare immutable Web image delivery
        if: steps.freshness.outputs.should_dispatch == 'true'
        id: delivery
        env:
          PLATFORM_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SCHEMA_VERSION: "1"
          SOURCE_REPOSITORY: AquilaXk/aquila-blog-web
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          TARGET_REPOSITORY: AquilaXk/aquila-blog
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "${SCHEMA_VERSION}" != "1" ]; then
            echo "Web image delivery schema version is invalid" >&2
            exit 1
          fi
          if [ "${SOURCE_REPOSITORY}" != "AquilaXk/aquila-blog-web" ]; then
            echo "Web image delivery source repository is invalid" >&2
            exit 1
          fi
          if [[ ! "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Web image delivery source SHA must be full lowercase hex" >&2
            exit 1
          fi
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Web image delivery digest must be immutable lowercase sha256" >&2
            exit 1
          fi
          if [ "${IMAGE_REF}" != "ghcr.io/aquilaxk/aquila-blog-web-front@${IMAGE_DIGEST}" ]; then
            echo "Web image delivery ref does not match the validated digest" >&2
            exit 1
          fi
          if [ "${TARGET_REPOSITORY}" != "AquilaXk/aquila-blog" ]; then
            echo "Web image delivery target repository is invalid" >&2
            exit 1
          fi
          if [[ ! "${PRODUCER_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || [[ ! "${PRODUCER_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Web image producer run identity is invalid" >&2
            exit 1
          fi
          if [ "${PRODUCER_RUN_URL}" != "https://github.com/${SOURCE_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}" ]; then
            echo "Web image producer run URL is invalid" >&2
            exit 1
          fi

          if ! TARGET_SHA="$(GH_TOKEN="${PLATFORM_GH_TOKEN}" gh api "repos/${TARGET_REPOSITORY}/commits/main" --jq '.sha')"; then
            echo "Platform main SHA lookup failed before image dispatch" >&2
            exit 1
          fi
          if [[ ! "${TARGET_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Platform main SHA lookup returned an invalid commit" >&2
            exit 1
          fi

          DELIVERY_ID="$(
            printf '%s\n' \
              "schema_version=${SCHEMA_VERSION}" \
              "source_repository=${SOURCE_REPOSITORY}" \
              "source_sha=${SOURCE_SHA}" \
              "image_digest=${IMAGE_DIGEST}" \
              "target_repository=${TARGET_REPOSITORY}" \
              "target_sha=${TARGET_SHA}" |
              openssl dgst -sha256 | awk '{print $NF}'
          )"
          if [[ ! "${DELIVERY_ID}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Web image delivery ID calculation failed" >&2
            exit 1
          fi

          {
            echo "target_sha=${TARGET_SHA}"
            echo "delivery_id=${DELIVERY_ID}"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch immutable Web image to Platform
        if: steps.freshness.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SCHEMA_VERSION: "1"
          SOURCE_REPOSITORY: AquilaXk/aquila-blog-web
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TARGET_REPOSITORY: AquilaXk/aquila-blog
          TARGET_SHA: ${{ steps.delivery.outputs.target_sha }}
          DELIVERY_ID: ${{ steps.delivery.outputs.delivery_id }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/AquilaXk/aquila-blog/dispatches" \
            -f event_type="web_frontend_image_ready" \
            -f "client_payload[schema_version]=${SCHEMA_VERSION}" \
            -f "client_payload[source_repository]=${SOURCE_REPOSITORY}" \
            -f "client_payload[source_sha]=${SOURCE_SHA}" \
            -f "client_payload[image_ref]=${IMAGE_REF}" \
            -f "client_payload[image_digest]=${IMAGE_DIGEST}" \
            -f "client_payload[target_repository]=${TARGET_REPOSITORY}" \
            -f "client_payload[target_sha]=${TARGET_SHA}" \
            -f "client_payload[delivery_id]=${DELIVERY_ID}" \
            -f "client_payload[producer_run_id]=${PRODUCER_RUN_ID}" \
            -f "client_payload[producer_run_attempt]=${PRODUCER_RUN_ATTEMPT}"

          {
            echo "## Web image delivery"
            echo "- status: dispatched"
            echo "- schema version: ${SCHEMA_VERSION}"
            echo "- delivery ID: ${DELIVERY_ID}"
            echo "- source: ${SOURCE_REPOSITORY}@${SOURCE_SHA}"
            echo "- image digest: ${IMAGE_DIGEST}"
            echo "- target: ${TARGET_REPOSITORY}@${TARGET_SHA}"
            echo "- producer run: [${PRODUCER_RUN_ID}](${PRODUCER_RUN_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"
